name: Drawspeak
options:
  bundleIdPrefix: com.wydrox
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 7S3F9767BM
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "2"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  DrawspeakKit:
    path: ../Packages/DrawspeakKit
targets:
  Drawspeak:
    type: application
    platform: iOS
    sources:
      - path: Drawspeak
    dependencies:
      - package: DrawspeakKit
        product: DrawspeakCore
      - package: DrawspeakKit
        product: T3Kit
      - package: DrawspeakKit
        product: VoiceKit
      - package: DrawspeakKit
        product: HTMLKit
      - package: DrawspeakKit
        product: CanvasKit
      - package: DrawspeakKit
        product: NotesKit
      - package: DrawspeakKit
        product: FeedbackKit
    info:
      path: Drawspeak/Info.plist
      properties:
        CFBundleDisplayName: Drawspeak
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.developer-tools
        NSMicrophoneUsageDescription: Drawspeak records your spoken comment about the part of the screen you marked.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.wydrox.drawspeak.oauth
            CFBundleURLSchemes:
              - drawspeak
        UTImportedTypeDeclarations: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wydrox.drawspeak
        PRODUCT_NAME: Drawspeak
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: Drawspeak App Store
schemes:
  Drawspeak:
    build:
      targets:
        Drawspeak: all
    run:
      config: Debug
    archive:
      config: Release
