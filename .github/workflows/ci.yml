name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # GitHub-hosted macOS runners are free for this public repository.
    runs-on: macos-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE" ]; then echo "::error::No Xcode 27 on this runner image"; exit 1; fi
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Pick an iPad simulator
        run: |
          xcrun simctl list runtimes
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          ipads = [d for runtime, devices in data.items() if "iOS-27" in runtime for d in devices if "iPad" in d["name"]]
          ipads.sort(key=lambda d: ("Pro 13" not in d["name"], d["name"]))
          print(ipads[0]["udid"] if ipads else "")')
          if [ -z "$UDID" ]; then echo "::error::No iOS 27 iPad simulator"; exit 1; fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"

      - name: Package tests (DrawspeakKit)
        working-directory: Packages/DrawspeakKit
        run: |
          set -o pipefail
          xcodebuild test -scheme DrawspeakKit-Package -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -skip-testing:RefineKitTests/LiveClaudeRefinerTests -skip-testing:VoiceKitTests/LiveElevenLabsTests \
            -skip-testing:VoiceKitTests/LiveRealtimeTests 2>&1 | tail -200

      - name: Build app
        working-directory: App
        run: |
          set -o pipefail
          xcodebuild -project Drawspeak.xcodeproj -scheme Drawspeak -destination "platform=iOS Simulator,id=$SIM_UDID" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -100
