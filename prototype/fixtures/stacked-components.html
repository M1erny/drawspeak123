<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stacked component fixture</title>
<style>
*{box-sizing:border-box}body{margin:0;background:white;color:#24374c;font:14px system-ui}
main{position:relative;width:330px;height:480px;padding:24px}
h1{font-size:25px;margin:0 0 16px}p{line-height:1.6;color:#536377}
.item{height:110px;background:#e7edf5;border-radius:10px;display:grid;place-items:center;margin:24px 0}
footer{position:absolute;left:24px;right:24px;top:330px;height:110px}
button{width:100%;height:48px;padding:0;border:0;border-radius:9px;background:#264e81;color:white;font:600 14px system-ui}
button span{display:grid;place-items:center;width:100%;height:100%}
aside{position:absolute;z-index:5;top:340px;left:74px;width:180px;height:28px;background:#1758bd;color:white;border-radius:5px}
aside span{display:grid;place-items:center;width:100%;height:100%;font-size:12px}
.caption{font-size:12px;margin-top:18px;text-align:center}
</style>
</head>
<body>
<main data-review-root data-review-id="checkout" data-review-name="Checkout">
  <h1>Checkout</h1>
  <p>Inspect the overlay, then choose the payment button underneath.</p>
  <section class="item" data-review-id="item" data-review-name="Order Item">Everyday tote · $48.00</section>
  <footer data-review-id="payment" data-review-name="Payment Section">
    <button data-review-id="pay-action" data-review-name="Pay Button"><span data-review-id="pay-label" data-review-name="Pay Label">Pay $48.00</span></button>
    <p class="caption">Secure payment. Easy returns.</p>
  </footer>
  <aside data-review-id="overlay" data-review-name="Overlay"><span data-review-id="overlay-label" data-review-name="Overlay Label">Overlay above the button</span></aside>
</main>
</body>
</html>
